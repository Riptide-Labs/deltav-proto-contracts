[package]
name = "deltav-proto-contracts"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Canonical Apache 2.0 licensed Protobuf schemas and gRPC contracts for OpenNMS Delta-V multi-protocol telemetry."
repository = "https://github.com/Riptide-Labs/deltav-proto-contracts"

[dependencies]
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["full"] }

[build-dependencies]
tonic-prost-build = "0.14"
