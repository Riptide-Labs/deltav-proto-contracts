syntax = "proto3";

package deltav.flows.v1;

import "deltav/flows/v1/flow_envelope.proto";

option java_multiple_files = true;
option java_package = "org.deltav.flows.v1.proto";
option go_package = "github.com/Riptide-Labs/deltav-proto-contracts/gen/go/deltav/flows/v1;flowsv1";

// Transport for raw flow datagrams from a capture tier to a broker.
//
// The gateway is a thin authenticated pass-through, not a translator. It
// forwards the envelope to Kafka without re-encoding it, stamping only the
// tenancy and gateway-timestamp fields. A gateway that translates into a
// different message shape drops fields, and the fields most likely to be
// dropped are the loss-attribution triple, which is the whole point of the
// envelope.
//
// A gateway exists only to serve a trust or topology boundary: collectors that
// must not hold broker credentials or reach broker ports. Where no such
// boundary exists, the capture tier should write the broker directly and this
// service should not be deployed.
service FlowIngestionService {
  // Bidirectional stream of datagrams, acknowledged cumulatively.
  //
  // One stream per collector, not one per protocol. The datagram class rides
  // in the envelope, so the gateway routes by field rather than by method and
  // non-flow classes (syslog, SNMP) need no special case.
  rpc PublishDatagrams (stream PublishDatagramsRequest) returns (stream PublishDatagramsResponse);
}

// One datagram offered to the gateway.
message PublishDatagramsRequest {
  // The datagram and its capture-tier provenance.
  //
  // The gateway extracts this field's length-delimited payload and writes it
  // as the Kafka record value, appending its tenancy and timestamp encoding.
  // Extracting one top-level field does not require decoding the envelope, so
  // the pass-through property survives the request wrapper.
  FlowEnvelope envelope = 1;
}

// Cumulative durability acknowledgement.
//
// Unlike an acknowledgement carrying only a timestamp, this identifies WHICH
// datagrams are durable, which is what makes at-least-once expressible: the
// gateway emits this only after the broker's producer acknowledgement returns,
// and the capture tier may retire its outbound queue up to that point.
//
// This implies the gateway's producer should acknowledge on full replication
// rather than leader-only. Acknowledging upstream on a leader-only write means
// an unreplicated leader failure loses datagrams the capture tier has already
// counted as delivered, which is precisely the silent loss the envelope's
// sequence fields exist to prevent.
message PublishDatagramsResponse {
  // Capture-tier instance this acknowledgement applies to.
  string ramp_instance_id = 1;

  // Capture-tier pipeline this acknowledgement applies to.
  uint32 pipeline_id = 2;

  // Every ramp_sequence at or below this value is durable in the broker.
  uint64 ack_through_sequence = 3;

  // Gateway timestamp for this acknowledgement, nanoseconds since the Unix
  // epoch. Lets the capture tier measure acknowledgement latency without a
  // local round-trip clock.
  uint64 acked_at_unix_nanos = 4;
}
