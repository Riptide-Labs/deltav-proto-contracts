syntax = "proto3";

package deltav.nodes.v1;

option java_multiple_files = true;
option java_package = "org.deltav.nodes.v1.proto";
option go_package = "github.com/pbrane/deltav-proto-contracts/gen/go/deltav/nodes/v1;nodesv1";

// Compiled, resolved network node configuration emitted to Kafka topic `deltav-nodes-config`
message CompiledNetworkNodeConfig {
  // Primary node identifier / hostname
  string node_name = 1;

  // Management IP address or FQDN
  string address = 2;

  // Logical location name (e.g. "Chicago-DC1", "Default")
  string location = 3;

  // Key-value metadata labels (e.g. vendor, model, role, site)
  map<string, string> labels = 4;

  // Resolved SNMP v2c/v3 configuration
  SnmpResolvedConfig snmp = 5;

  // Resolved gNMI streaming configuration
  GnmiResolvedConfig gnmi = 6;

  // Resolved NetFlow / IPFIX flow collection configuration
  FlowsResolvedConfig flows = 7;
}

message SnmpResolvedConfig {
  int32 port = 1;
  string version = 2;
  string security_name = 3;
  string auth_protocol = 4;
  string auth_password = 5; // Resolved secret (in-memory)
  string priv_protocol = 6;
  string priv_password = 7; // Resolved secret (in-memory)
  repeated string mib_groups = 8;
}

message GnmiResolvedConfig {
  int32 port = 1;
  string username = 2;
  string password = 3; // Resolved secret (in-memory)
  bool tls_enabled = 4;
  string ca_cert_data = 5;
  uint64 sample_interval_ms = 6;
  repeated string yang_paths = 7;
}

message FlowsResolvedConfig {
  string engine = 1; // "ipfix", "netflow_v9", "sflow"
  uint32 sample_rate = 2;
  uint32 active_timeout_seconds = 3;
}
