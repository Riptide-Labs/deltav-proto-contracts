syntax = "proto3";

package deltav.nodes.v1;

option java_multiple_files = true;
option java_package = "org.deltav.nodes.v1.proto";
option go_package = "github.com/pbrane/deltav-proto-contracts/gen/go/deltav/nodes/v1;nodesv1";

// Node context metadata message for GlobalKTable joins
message NodeContext {
  // Numeric node ID
  int32 node_id = 1;

  // Foreign node label or identifier
  string foreign_source = 2;
  string foreign_id = 3;

  // Node label / hostname
  string node_label = 4;

  // Logical location name (e.g. "Default", "Site-A")
  string location = 5;

  // Primary IP address
  string ip_address = 6;

  // System object OID
  string sys_object_id = 7;
}
