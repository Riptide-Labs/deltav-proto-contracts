syntax = "proto3";

package deltav.telemetry.v1;

import "deltav/telemetry/v1/telemetry_metric.proto";

option java_multiple_files = true;
option java_package = "org.deltav.telemetry.v1.proto";
option go_package = "github.com/pbrane/deltav-proto-contracts/gen/go/deltav/telemetry/v1;telemetryv1";

// Cloud-Native gRPC Ingestion Service for telemetry metric streaming
service TelemetryIngestionService {
  // Client-streaming endpoint for pushing telemetry metric batches over HTTP/2
  rpc ExportMetrics (stream TelemetryMetricBatch) returns (ExportMetricsResponse);
}

// Response message for telemetry metric batch export
message ExportMetricsResponse {
  // Total number of metric points successfully received by the gateway
  uint64 metrics_received = 1;

  // Status flag indicating successful ingestion
  bool success = 2;

  // Human-readable error message (if success is false)
  string error_message = 3;
}
