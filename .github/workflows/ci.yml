name: Protobuf CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  buf-lint-and-check:
    name: Buf Lint & Breaking Change Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - name: Buf Lint
        uses: bufbuild/buf-lint-action@v1

      - name: Buf Breaking Check
        uses: bufbuild/buf-breaking-action@v1
        with:
          against: 'https://github.com/pbrane/deltav-proto-contracts.git#branch=main'

  build-java-and-rust:
    name: Build Java & Rust Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Java Maven Artifact
        run: mvn clean compile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Crate
        run: cargo check
