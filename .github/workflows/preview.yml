#
# Refreshes a single rolling 'preview' prerelease from main. It never carries a
# version tag and never becomes the latest release. See RELEASING.md.
name: Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
      actions: read # the called zizmor gate reads workflow run metadata
      security-events: write # the called zizmor gate uploads SARIF

  preview:
    name: Refresh the preview prerelease
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # rolls the preview prerelease and its tag over
      id-token: write # cosign keyless signing via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache here either: these artifacts are signed, and a cache a
      # pull request build can write must not reach them.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin

      - name: Build artifacts
        run: make package

      - name: Collect artifacts
        run: |
          version="$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p dist
          cp "target/deltav-proto-contracts-${version}.jar" "dist/deltav-proto-contracts-preview.jar"
          cp "target/deltav-proto-contracts-${version}-sources.jar" "dist/deltav-proto-contracts-preview-sources.jar"
          tar -czf dist/proto-preview.tar.gz proto

      - name: Write checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: |
          cosign sign-blob --yes dist/checksums.txt --bundle dist/checksums.txt.bundle

      # gh is on the runner, so the publishing step needs no third-party action.
      - name: Publish the preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          # Roll the previous preview over, tag included, so the tag tracks main.
          gh release delete preview --yes --cleanup-tag || true
          printf 'Rolling build of main, replaced on every push. Not a release.\n\nBuilt from %s. Use a version tag for anything real.\n' "${SHA}" > notes.md
          gh release create preview dist/* \
            --prerelease \
            --target "${SHA}" \
            --title "Preview build" \
            --notes-file notes.md
