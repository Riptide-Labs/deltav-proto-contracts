# Refreshes a single rolling 'preview' prerelease from main. It never carries a
# version tag and never becomes the latest release. See RELEASING.md.
name: Preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  gates:
    name: Quality gates
    uses: ./.github/workflows/quality-gates.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  preview:
    name: Refresh the preview prerelease
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build artifacts
        run: make package

      - name: Collect artifacts
        run: |
          version="$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p dist
          cp "target/deltav-proto-contracts-${version}.jar" "dist/deltav-proto-contracts-preview.jar"
          cp "target/deltav-proto-contracts-${version}-sources.jar" "dist/deltav-proto-contracts-preview-sources.jar"
          tar -czf dist/proto-preview.tar.gz proto

      - name: Write checksums
        run: |
          cd dist
          sha256sum ./* > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: |
          cosign sign-blob --yes dist/checksums.txt \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem

      - name: Publish the preview prerelease
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: preview
          name: Preview build
          body: |
            Rolling build of `main`, replaced on every push. Not a release.

            Built from ${{ github.sha }}. Use a version tag for anything real.
          prerelease: true
          make_latest: 'false'
          files: dist/*
          fail_on_unmatched_files: true
