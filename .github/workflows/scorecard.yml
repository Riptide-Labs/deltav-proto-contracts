#
# OpenSSF Scorecard grades the supply-chain posture this repository already
# enforces by review: pinned actions, branch protection, signed releases, SAST.
# Treat a dropped score as a regression report, not a suggestion.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 2'

# Scorecard's own template suggests read-all; the job below asks for exactly what
# it needs instead, which is what the rest of this repository's workflows do.
permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout
      security-events: write # upload the SARIF results
      id-token: write # publish the score to the OpenSSF API
      actions: read # the Branch-Protection and Webhooks checks read workflow data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
