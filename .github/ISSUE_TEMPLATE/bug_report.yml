name: Bug report
description: Something in the schemas, generated code, or build is wrong
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        For a security vulnerability, do not use this form. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What went wrong, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The exact steps or `make` command, and the output you got.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      multiple: true
      options:
        - Protobuf schemas
        - Java artifact
        - Rust crate
        - Go stubs
        - Build or CI
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, JDK, Rust, protoc and buf versions where relevant.
      render: shell
