version: 2

updates:
  # Keeps the SHA pins (and their version comments) in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: build
    groups:
      # prost, tonic and tonic-build must move together: a 0.x bump is a major
      # under semver, so excluding majors here files them as separate PRs that
      # each fail to build on their own.
      rust:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - dependencies
    commit-message:
      prefix: build
    groups:
      # protobuf-java and grpc-java must move together. protobuf.version also
      # selects protoc, so bumping it alone regenerates the stubs against a
      # runtime that grpc-java's own pin does not support.
      java:
        patterns:
          - '*'
        update-types:
          - major
          - minor
          - patch
