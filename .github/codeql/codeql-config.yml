name: deltav-proto-contracts

queries:
  - uses: security-and-quality

paths-ignore:
  # Protobuf and gRPC stubs, regenerated on every build. Findings here are not
  # actionable: the fix would be upstream in protoc or grpc-java, not in this repo.
  - 'target/generated-sources/**'
  - '**/generated-sources/**'
  - 'gen/**'

query-filters:
  - exclude:
      id: java/missing-override-annotation
